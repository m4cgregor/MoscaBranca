version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moscabranca_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moscabranca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: moscabranca_redis
    ports:
      - "6379:6379"
    restart: always

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: moscabranca_whatsapp
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - DOCKER_ENV=true
      - AUTHENTICATION_API_KEY=moscabranca-secret-key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/moscabranca
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
